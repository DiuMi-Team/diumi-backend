spring:
  datasource:
    url: jdbc:h2:mem:diumi;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

openai:
  api-key: test-key
  base-url: https://api.openai.com
  realtime:
    model: gpt-realtime
    client-secret-ttl-seconds: 600
