spring:
  application:
    name: diumi-backend
  jackson:
    property-naming-strategy: SNAKE_CASE

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://diumi.vercel.app}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

openai:
  api-key: ${OPENAI_API_KEY:}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com}
  realtime:
    model: ${OPENAI_REALTIME_MODEL:gpt-realtime}
    transcription-model: ${OPENAI_REALTIME_TRANSCRIPTION_MODEL:gpt-transcribe}
    client-secret-ttl-seconds: ${OPENAI_REALTIME_CLIENT_SECRET_TTL_SECONDS:600}
